name: fetch-photos
on:
  push:
    paths: ['.github/workflows/fetch-photos.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: download
        run: |
          mkdir -p images/raw
          dl() { curl -fsSL -A "Mozilla/5.0" -o "images/raw/$1" "$2" && echo "ok $1" || echo "NG $1"; }
          dl top.jpg        https://cdn.amebaowndme.com/madrid-prd/madrid-web/images/sites/602469/9d8177c254007fa6554d8daf17c92144_98921797432c4b108473e714e7824df6.jpg
          dl shichigosan.jpg https://cdn.amebaowndme.com/madrid-prd/madrid-web/images/sites/602469/cd99fec097391cd714487c8716f94e93_7eb1531e8e53aee4524613b9523360e5.jpg
          dl kimono.jpg     https://cdn.amebaowndme.com/madrid-prd/madrid-web/images/sites/602469/b9cfdfa51ea55a7a0ebc40c78bdc1474_7c64e151b125b7e7faeac9468485a67e.jpg
          dl seijinshiki.jpg https://cdn.amebaowndme.com/madrid-prd/madrid-web/images/sites/602469/06a2749ce7b0e093ea6ac23e96f1c6a1_b5b57b497ec8c18fef7c07245aa8a008.jpg
          dl hakama.jpg     https://cdn.amebaowndme.com/madrid-prd/madrid-web/images/sites/602469/f9a48b6ccf2e2fc74f3e50652cd7c2b3_e3bed5532cd69f7baff331c041a5343c.jpg
          dl yukata.jpg     https://cdn.amebaowndme.com/madrid-prd/madrid-web/images/sites/602469/91d6276c7051e22705e7523a538019f7_b13fcb773f4267ac0303770f8d1174ce.jpg
          dl firstcut.jpg   https://cdn.amebaowndme.com/madrid-prd/madrid-web/images/sites/602469/9596dc62bcf82903cfcf76d4668e898d_d102c54788eec9a3d524f732900c396b.jpg
          dl claycolor.jpg  https://cdn.amebaowndme.com/madrid-prd/madrid-web/images/sites/602469/95bfd3e7603e12152071782ec7df5659_17be59d7d80d3c73ea30a544530496b7.jpg
          dl scienceaqua.png https://cdn.amebaowndme.com/madrid-prd/madrid-web/images/sites/602469/4900439031ef56f11903f40d5ff420f7_500111978756d1b0c53534818ba4a2cb.png
          dl b1.jpg         https://cdn.amebaowndme.com/madrid-prd/madrid-web/images/sites/602469/95cf20d95edfd292a88f9e926ec2e78f_8d09ad6541ff9be94e406f896c96372b.jpg
          dl donation.jpg   https://cdn.amebaowndme.com/madrid-prd/madrid-web/images/sites/602469/3eac829dbf5ef5c15999baa52993dcc7_0d267ff8b5b2337c642582f99b5934f7.jpg
          dl line.png       https://cdn.amebaowndme.com/madrid-prd/madrid-web/images/sites/602469/491b7b5d3a29c0c424c20638b53d792d_a2db2695a2a15aa3d8105790a2f1172a.png
          dl menu.png       https://cdn.amebaowndme.com/madrid-prd/madrid-web/images/sites/602469/f35979405587781e5f9120045d1e0f86_c8ed594b20a0958c5e29b83cbac61b81.png
          ls -la images/raw
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/raw
          git commit -m "サロン公式サイトの写真を取り込み" || echo nothing
          git push
